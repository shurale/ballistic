# Конфигурация для 3D-моделирования баллистики с учётом ветра
# Все параметры в единицах СИ

# Начальная скорость (м/с)
v0 = 90.0;

# Угол возвышения — угол между горизонтом и вектором скорости (градусы)
angle = 45.0;

# Азимут — угол в горизонтальной плоскости между осью X и проекцией
# вектора скорости (градусы). 0° — стрельба вдоль +X, 90° — вдоль +Z.
azimuth = 00.0;


# Начальные координаты (м)
x0 = 0.0;
y0 = 1.5;
z0 = 0.0;

# Параметры ветра
# Скорость ветра (м/с)
windspeed = 5.0;

# Направление ветра (градусы)
# 0° — ветер дует вдоль +X (попутный при стрельбе вдоль X)
# 90° — ветер дует вдоль +Z (боковой)
# 180° — ветер дует вдоль -X (встречный)
winddir = 90.0;

# --- Атмосфера ---
temperature_c  = 15.0;    # °C
pressure_mmhg  = 760.0;   # мм рт.ст.

# --- Модель сопротивления ---
drag_model = "sphere";    # "sphere" = Cd(Re,M); "constant" = k_over_m
diameter_mm = 6.0;        # диаметр шара
mass_g      = 0.2;        # масса
                          # Коэффициент сопротивления воздуха, деленный на массу
k_over_m    = 0.0407;     # используется только при drag_model="constant"

# --- Необязательно: своя таблица Cd(M) ---
# cd_table_m  = [0.50, 0.60, 0.70, 0.80, 0.90, 1.00, 1.20, 1.50, 2.00, 3.00, 6.00];
# cd_table_cd = [0.480,0.510,0.550,0.630,0.760,0.890,0.985,0.980,0.930,0.885,0.905];

