# Конфигурация для 3D-моделирования баллистики с учётом ветра
# Все параметры в единицах СИ

# Снаряд - семенная бомбочка, то есть шарик из глинистой земли и семян
# d        = 10.0 мм
# rho_mat  = 1000 кг/м^3
# m        = 0.0005 кг (0.52 г)
# A        = 7.853982e-05 м^2
# Cd       = 0.470
# k_over_m = 4.318125e-02 1/м   <-- в projectile.conf
# 1/k      = 23.2 м
# v_term   = 15.1 м/с

# Начальная скорость (м/с)
v0 = 10.0;

# Угол возвышения — угол между горизонтом и вектором скорости (градусы)
angle = 45.0;

# Азимут — угол в горизонтальной плоскости между осью X и проекцией
# вектора скорости (градусы). 0° — стрельба вдоль +X, 90° — вдоль +Z.
azimuth = 00.0;

# Коэффициент сопротивления воздуха, деленный на массу
k_over_m = 0.0432;

# Начальные координаты (м)
x0 = 0.0;
y0 = 20.0;
z0 = 0.0;

# Параметры ветра
# Скорость ветра (м/с)
windspeed = 1.0;

# Направление ветра (градусы)
# 0° — ветер дует вдоль +X (попутный при стрельбе вдоль X)
# 90° — ветер дует вдоль +Z (боковой)
# 180° — ветер дует вдоль -X (встречный)
winddir = 90.0;
